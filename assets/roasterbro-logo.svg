<svg width="462" height="140" viewBox="20 6 462 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4E00" />
      <stop offset="55%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4E00" />
      <stop offset="45%" stop-color="#FF8A00" />
      <stop offset="75%" stop-color="#FF3D68" />
      <stop offset="100%" stop-color="#B721FF" />
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Flame icon -->
  <g transform="translate(28, 26)" filter="url(#softGlow)">
    <path d="
      M 32 4
      C 20 18, 14 30, 18 44
      C 20 51, 26 56, 34 56
      C 30 50, 30 44, 34 38
      C 38 44, 44 46, 44 56
      C 52 52, 56 44, 54 34
      C 52 26, 44 22, 44 12
      C 40 20, 36 22, 36 16
      C 36 10, 34 6, 32 4
      Z"
      fill="url(#flameGrad)" />
  </g>

  <!-- Wordmark -->
  <text x="96" y="98"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="60"
        font-weight="bold"
        font-style="italic"
        fill="url(#textGrad)"
        letter-spacing="1">roasterbro</text>

  <!-- Tagline -->
  <text x="98" y="126"
        font-family="'Courier New', monospace"
        font-size="15"
        letter-spacing="3"
        fill="#8A8AA3">SCAN&#8202;·&#8202;ANALYZE&#8202;·&#8202;ROAST</text>
</svg>
